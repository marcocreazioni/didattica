<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div>
        <!--area del grafico-->
        <canvas id="myChart"></canvas>
    </div>


<script>
    //ctx e associato all'id my chart
const ctx = document.getElementById('myChart');
//creazione di un oggetto //insieme di elementi di vari tipi
//nuovo oggetto chart()
  new Chart(ctx, {
    //grafico a barre
    type: 'bar',
    //ara dati del grafico
    data: {
      labels: ['Red', 'Blue', 'Yellow', 'Green', 'Purple', 'Orange'],
      datasets: [{
        label: '# of Votes',
        data: [12, 19, 20, 5, 2, 3],
        backgroundColor: [
      'rgba(255, 99, 132, 0.2)',
      'rgba(255, 159, 64, 0.2)',
      'rgba(255, 205, 86, 0.2)',
      'rgba(75, 192, 192, 0.2)',
      'rgba(54, 162, 235, 0.2)',
      'rgba(153, 102, 255, 0.2)'
      
    ],
        borderWidth: 1
      }]
    },
    //coordinate e altre ozpioni del grafico
    options: {
      scales: {
        y: {
          beginAtZero: true
        }
      }
    }
  });
</script>
 
 



</script>
</body>
</html>
