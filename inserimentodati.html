<!DOCTYPE html>

<head>

    <title>Parametri</title>
</head>
<body>
    <h1>Parametri larghezza gonna</h1>
    <!-- a differenza di javascript php ha bisogno sempre
     del tag form per prelevare i dati e aggiungere l'attributo
     action con il file php al quale sono destinati i dati 
     shhiunhismo anche un metodo di prelievo dati 
     method per la raccolta dei dati POST o GET  -->
<form action="funzioni.php" method="post">
    <label>Inserisci la circonferenza Fianchi</label><br>
    <input type="number" name="circonferenza" required><br>
    <label>Inserisci la vestibilita</label><br>
       <select name="vestibilita" required>
        <option value="1">Tessuto Elastico</option>
        <option value="2">Tessuto Rigido</option>
       </select><br><br>
<!--invia i dati all'action-->
<input type="submit"> 

</form>



</body>
